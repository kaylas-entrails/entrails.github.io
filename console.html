<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>console</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      color: White;
      font-family: 'VT323', monospace;
      line-height: 1.6;
      padding: 20px;
      overflow-x: hidden;
    }
    
    input {
      background-color: #000;
      color: White;
      font-family: 'VT323', monospace;
      line-height: 1.6;
      padding: 20px;
      overflow-y: hidden;
      font-size: 16px;
    }
    
    #chat-input {
      border: none;
      outline: none;
    }

    .crt-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 999;
      animation: flicker 0.15s infinite;
    }

    @keyframes flicker {
      0% { opacity: 0.9; }
      50% { opacity: 1; }
      100% { opacity: 0.9; }
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid White;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .ascii-art {
      white-space: pre;
      font-size: 16px;
      line-height: 1.2;
      text-align: center;
      margin: 20px 0;
    }

    .terminal-window {
      border: 2px solid White;
      padding: 20px;
      margin: 20px 0;
      position: relative;
    }

    .terminal-header {
      position: absolute;
      top: -15px;
      left: 20px;
      background: #000;
      padding: 0 10px;
    }

    .blink {
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .popup {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #000;
      border: 1px solid White;
      padding: 10px;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

  </style>
  <script src="meowbot.js" defer></script>
</head>
<body>
  <div class="crt-overlay"></div>
  
  <div class="container">
    <div class="header">
      <div class="ascii-art">
╭━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━╮
│             ^ meowbot.exe ^             │
╰━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━╯
      </div>
    </div>

    <div class="terminal-window">
      <div class="terminal-header">system.status</div>
      <p>><span class="blink">_</span> YOU SHOULDN'T BE HERE...</p>
      <p>> LOADING BRAIN MODULES...</p>
      <p>> SYSTEM STATUS: BARELY FUNCTIONING <span class="blink">⚠</span></p>
      <p>> CURRENT MOOD: 404</p>
    </div>

    <div class="terminal-window">
      <div class="terminal-header">chat.log</div>
      <div id="chat-messages"></div>
      <input id="chat-input" type="text" placeholder="> MeowBot is sleeping...">
    </div>
  </div>

  <div class="popup">
    [!] New notification: You are losing your mind... <span class="blink">▊</span>
  </div>

  <script>
    // Add random glitch effects
    setInterval(() => {
      const windows = document.querySelectorAll('.terminal-window');
      const randomWindow = windows[Math.floor(Math.random() * windows.length)];
      randomWindow.style.transform = 'skew(1deg)';
      setTimeout(() => {
        randomWindow.style.transform = 'skew(0deg)';
      }, 100);
    }, 3000);

    // Create random system messages
    const messages = [
      "CLICK HERE!!!",
      "Don't trust people in the cyber world.",
      "ALERT: Go outside.",
      "Scanning for bitches...",
      "Debugging malware.exe",
      "MeowBot Status: Offline :(",
      "01001100 01001111 01001100"
    ];

    setInterval(() => {
      const popup = document.querySelector('.popup');
      popup.textContent = '[!] ' + messages[Math.floor(Math.random() * messages.length)] + ' ';
      const blink = document.createElement('span');
      blink.className = 'blink';
      blink.textContent = '▊';
      popup.appendChild(blink);
    }, 5000);
  </script>
</body>
</html>
