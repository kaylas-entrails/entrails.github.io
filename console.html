<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>console</title>
  <script src="meowbot.js" defer></script>
  <link href="console-style.css" rel="stylesheet" type="text/css" media="all">
</head>
<body>
  <div class="crt-overlay"></div>
  
  <div class="container">
    <div class="header">
      <div class="ascii-art">
╭━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━╮
│             ^ meowbot.exe ^             │
╰━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━╯
      </div>
    </div>

    <div class="terminal-window">
      <div class="terminal-header">system.status</div>
      <p>><span class="blink">_</span> YOU SHOULDN'T BE HERE...</p>
      <p>> LOADING BRAIN MODULES...</p>
      <p>> SYSTEM STATUS: BARELY FUNCTIONING <span class="blink">⚠</span></p>
      <p>> CURRENT MOOD: 404</p>
    </div>

    <div class="terminal-window">
      <div class="terminal-header">chat.log</div>
      <div id="chat-messages"></div>
      <div id="input-wrapper">
        <span id="chat-prep">> user:</span>
        <input id="chat-input" type="text" placeholder=" ">
      </div>
    </div>
  </div>

  <div class="popup">
    [!] New notification: You are losing your mind... <span class="blink">▊</span>
  </div>

  <script>
    // Add random glitch effects
    setInterval(() => {
      const windows = document.querySelectorAll('.terminal-window');
      const randomWindow = windows[Math.floor(Math.random() * windows.length)];
      randomWindow.style.transform = 'skew(1deg)';
      setTimeout(() => {
        randomWindow.style.transform = 'skew(0deg)';
      }, 100);
    }, 3000);

    // Create random system messages
    const messages = [
      "CLICK HERE!!!",
      "Don't trust people in the cyber world.",
      "ALERT: Go outside.",
      "Scanning for bitches...",
      "Debugging malware.exe",
      "MeowBot Status: Offline :(",
      "01001100 01001111 01001100"
    ];

    setInterval(() => {
      const popup = document.querySelector('.popup');
      popup.textContent = '[!] ' + messages[Math.floor(Math.random() * messages.length)] + ' ';
      const blink = document.createElement('span');
      blink.className = 'blink';
      blink.textContent = '▊';
      popup.appendChild(blink);
    }, 5000);
  </script>
</body>
</html>
